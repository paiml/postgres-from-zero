<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
<!-- HERO — paiml/postgres-from-zero README banner.
     Visual story: psql REPL → Pagila join (customer ⨝ rental ⨝ film)
     → sqlx::PgPool Rust crate. Right-edge pillar lists the 13 named
     provable contracts the capstone asserts at runtime. Same
     oxide-premium chassis as duckdb-from-zero and mysql-from-zero. -->

<defs>
  <style>
    .h { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', monospace; }
    .label { font-family: 'Segoe UI', sans-serif; letter-spacing: 0.12em; }
  </style>

  <radialGradient id="bg" cx="50%" cy="40%" r="80%">
    <stop offset="0%" stop-color="#1a2540"/>
    <stop offset="100%" stop-color="#0e1726"/>
  </radialGradient>
  <linearGradient id="accent-strip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5fb1ff" stop-opacity="0.85"/>
    <stop offset="50%" stop-color="#00b8d9" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#9c84ff" stop-opacity="0.85"/>
  </linearGradient>
  <radialGradient id="zone-psql" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5fb1ff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#5fb1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="zone-pagila" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#36b37e" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#36b37e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="zone-rust" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9c84ff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#9c84ff" stop-opacity="0"/>
  </radialGradient>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 7 L 0 14 Z" fill="#00b8d9"/>
  </marker>
</defs>

<rect width="1280" height="480" fill="url(#bg)"/>

<!-- Top accent strip -->
<rect x="0" y="0" width="1280" height="6" fill="url(#accent-strip)"/>

<!-- Title block — left third -->
<g class="h">
  <text x="60" y="92" font-size="44" font-weight="700" fill="#eeeeee">Postgres from Zero</text>
  <text x="60" y="132" font-size="20" fill="#a5d6ff" letter-spacing="0.05em">Rust for Data Engineering · sqlx · Pagila · Capstone-ready</text>
  <text x="60" y="162" font-size="14" fill="#5fb1ff" letter-spacing="0.10em" font-weight="700">8 SQL EXAMPLES · 13 PROVABLE CONTRACTS · 100% COVERAGE</text>
</g>

<!-- Stop 1: psql REPL centered at x=240, y=300 -->
<circle cx="240" cy="300" r="120" fill="url(#zone-psql)"/>
<g id="stop-psql">
  <rect x="160" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#5fb1ff" stroke-width="3"/>
  <rect x="160" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#5fb1ff" stroke-width="2.5"/>
  <circle cx="178" cy="256" r="5" fill="#ff5630"/>
  <circle cx="195" cy="256" r="5" fill="#ffab00"/>
  <circle cx="212" cy="256" r="5" fill="#36b37e"/>
  <text x="240" y="300" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#5fb1ff">pagila=#</text>
  <text x="240" y="324" text-anchor="middle" class="m" font-size="14" fill="#5fb1ff">\dt</text>
  <text x="240" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#5fb1ff">PSQL</text>
</g>

<!-- Stop 2: Pagila join centered at x=600, y=300 -->
<circle cx="600" cy="300" r="120" fill="url(#zone-pagila)"/>
<g id="stop-pagila">
  <rect x="520" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#36b37e" stroke-width="3"/>
  <rect x="520" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#36b37e" stroke-width="2.5"/>
  <text x="538" y="262" class="m" font-size="14" font-weight="700" fill="#7ee787">SQL</text>
  <text x="600" y="295" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#7ee787">customer JOIN</text>
  <text x="600" y="318" text-anchor="middle" class="m" font-size="14" fill="#7ee787">rental JOIN film</text>
  <text x="600" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#36b37e">PAGILA · 1 000 films</text>
</g>

<!-- Stop 3: rust centered at x=960, y=300 -->
<circle cx="960" cy="300" r="120" fill="url(#zone-rust)"/>
<g id="stop-rust">
  <rect x="880" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#9c84ff" stroke-width="3.5"/>
  <rect x="880" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#9c84ff" stroke-width="2.5"/>
  <text x="898" y="262" class="m" font-size="14" font-weight="700" fill="#9c84ff">RS</text>
  <text x="960" y="295" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#b8acff">sqlx::PgPool</text>
  <text x="960" y="318" text-anchor="middle" class="m" font-size="14" fill="#b8acff">+ FromRow</text>
  <text x="960" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#9c84ff">RUST</text>
</g>

<!-- Arrows between stops -->
<line x1="330" y1="300" x2="510" y2="300" stroke="#00b8d9" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="690" y1="300" x2="870" y2="300" stroke="#00b8d9" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Provable contracts pillar — right edge -->
<g id="contracts-pillar">
  <rect x="1100" y="200" width="140" height="200" rx="10" fill="#0e1726" stroke="#7ee787" stroke-width="3"/>
  <rect x="1100" y="200" width="140" height="36" rx="10" fill="#1f4d3a" stroke="#7ee787" stroke-width="2"/>
  <text x="1170" y="224" text-anchor="middle" class="h" font-size="15" font-weight="700" fill="#eeeeee">13 contracts</text>
  <line x1="1110" y1="252" x2="1230" y2="252" stroke="#7ee787" stroke-width="1.5" opacity="0.5"/>
  <text x="1118" y="276" class="m" font-size="13" fill="#a8f0c5">row-count</text>
  <text x="1118" y="298" class="m" font-size="13" fill="#a8f0c5">top-nonzero</text>
  <text x="1118" y="320" class="m" font-size="13" fill="#a8f0c5">monotonic</text>
  <text x="1118" y="342" class="m" font-size="13" fill="#a8f0c5">row-shape</text>
  <text x="1118" y="364" class="m" font-size="13" fill="#a8f0c5">run-output</text>
  <text x="1170" y="390" text-anchor="middle" class="label" font-size="11" fill="#7ee787">asserted at runtime</text>
</g>

<!-- Bottom contracts strip — single line -->
<g id="contracts-strip">
  <rect x="60" y="420" width="1160" height="36" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="2" fill-opacity="0.85"/>
  <text x="80" y="444" class="h" font-size="14" font-weight="700" fill="#7ee787">contract:</text>
  <text x="170" y="444" class="m" font-size="14" fill="#eeeeee">rows == limit  ·  top.count ≥ 1  ·  ORDER BY DESC monotonic  ·  id &gt; 0  ·  text well-formed JSON</text>
</g>

<!-- GRID PROTOCOL MANIFEST
  template: HERO (README banner)
  canvas: 1280x480
  zones: psql@(240,300) | pagila@(600,300) | rust@(960,300) | contracts-pillar@(1100..1240, 200..400)
  text_elements: 21
  palette_colors: [#0e1726, #1a2540, #1a1d23, #161b22, #1f4d3a, #5fb1ff, #a5d6ff, #ffab00, #ff5630, #36b37e, #7ee787, #a8f0c5, #9c84ff, #b8acff, #00b8d9, #eeeeee]
  bounds_check: all elements within 0,0 → 1280,480
-->
</svg>
