services:
  postgres:
    image: postgres:16
    container_name: postgres-from-zero
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "pagila"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
